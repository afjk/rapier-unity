name: Native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  push:
    branches:
      - main
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

jobs:
  rust:
    name: Rust FFI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check
        working-directory: native

      - name: Test
        run: cargo test -p rapier_unity_ffi
        working-directory: native

      - name: Clippy
        run: cargo clippy -p rapier_unity_ffi --all-targets -- -D warnings
        working-directory: native

      - name: Release build
        run: cargo build --release -p rapier_unity_ffi
        working-directory: native

      - name: Stage macOS binary
        if: matrix.os == 'macos-latest'
        working-directory: native
        run: |
          mkdir -p dist
          cp target/release/librapier_unity_ffi.dylib dist/

      - name: Stage Linux binary
        if: matrix.os == 'ubuntu-latest'
        working-directory: native
        run: |
          mkdir -p dist
          cp target/release/librapier_unity_ffi.so dist/

      - name: Stage Windows binary
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: native
        run: |
          mkdir -p dist
          cp target/release/rapier_unity_ffi.dll dist/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: native/dist/*
          if-no-files-found: error

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build arm64-v8a
        working-directory: native
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a -o ./dist build --release -p rapier_unity_ffi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: native-android-arm64-v8a
          path: native/dist/arm64-v8a/librapier_unity_ffi.so
          if-no-files-found: error
