name: Native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/**"
      - "fixtures/rapier/**"
      - "tools/parity-js/**"
      - ".github/workflows/native.yml"
  push:
    branches:
      - main
    paths:
      - "native/**"
      - "fixtures/rapier/**"
      - "tools/parity-js/**"
      - ".github/workflows/native.yml"

jobs:
  rust:
    name: Rust FFI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests validate on Linux only to keep CI fast. The full
        # cross-platform matrix, Android build, and artifact uploads run on
        # pushes to main and on manual workflow_dispatch.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
        working-directory: native

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p rapier_unity_ffi --all-targets -- -D warnings
        working-directory: native

      - name: Test
        run: cargo test -p rapier_unity_ffi
        working-directory: native

      - name: Release build
        run: cargo build --release -p rapier_unity_ffi
        working-directory: native

      - name: Stage macOS binary
        if: matrix.os == 'macos-latest'
        working-directory: native
        run: |
          mkdir -p dist
          cp target/release/librapier_unity_ffi.dylib dist/

      - name: Stage Linux binary
        if: matrix.os == 'ubuntu-latest'
        working-directory: native
        run: |
          mkdir -p dist
          cp target/release/librapier_unity_ffi.so dist/

      - name: Stage Windows binary
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: native
        run: |
          mkdir -p dist
          cp target/release/rapier_unity_ffi.dll dist/

      - name: Upload binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: native/dist/*
          if-no-files-found: error

  js-parity:
    name: JS cross-host parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: tools/parity-js
        run: npm install

      - name: Verify against committed golden hashes
        working-directory: tools/parity-js
        run: node run.mjs

  android:
    name: Android (arm64-v8a)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build arm64-v8a
        working-directory: native
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a -o ./dist build --release -p rapier_unity_ffi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: native-android-arm64-v8a
          path: native/dist/arm64-v8a/librapier_unity_ffi.so
          if-no-files-found: error
