name: Native

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  push:
    branches:
      - main
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

jobs:
  rust:
    name: Rust FFI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check
        working-directory: native

      - name: Test
        run: cargo test -p rapier_unity_ffi
        working-directory: native

      - name: Clippy
        run: cargo clippy -p rapier_unity_ffi --all-targets -- -D warnings
        working-directory: native

      - name: Release build
        run: cargo build --release -p rapier_unity_ffi
        working-directory: native

