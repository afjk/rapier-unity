[package]
name = "rapier_unity_ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "C ABI bridge for Rapier for Unity."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bincode = "1.3"
rapier3d = { version = "=0.30.0", features = [
    "enhanced-determinism",
    "serde-serialize",
    "debug-render",
] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
serde_json = "1"
